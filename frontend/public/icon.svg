<svg width="128" height="128" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>CISE - Crisis Intelligence Synthesis Engine</title>
  <style>
    .tile { fill: #d9962b; }
    .glyph { stroke: #1a1f29; }
    .dot { fill: #1a1f29; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1a1f29; }
      .glyph { stroke: #f0b94d; }
      .dot { fill: #f0b94d; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <!-- signals (the open ring) converging on one point (the dot) -->
  <path class="glyph" d="M23.2 11.2A9 9 0 1 0 23.2 20.8" stroke-width="3" stroke-linecap="round" />
  <circle class="dot" cx="16" cy="16" r="3" />
</svg>
