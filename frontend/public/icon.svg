<svg width="128" height="128" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Virtual KL</title>
  <style>
    .tile { fill: #0e565c; }
    .ink { fill: #f6f3ea; }
    .ring { stroke: #f6f3ea; stroke-opacity: .55; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #6fe0cf; }
      .ink { fill: #10201f; }
      .ring { stroke: #10201f; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="9" />
  <!-- two towers (the city) inside a ring (the haze / watched perimeter) -->
  <circle class="ring" cx="16" cy="16" r="9.5" stroke-width="1.5" />
  <rect class="ink" x="11" y="9" width="4" height="15" rx="2" />
  <rect class="ink" x="17" y="9" width="4" height="15" rx="2" />
  <rect class="ink" x="14.5" y="16" width="3" height="1.6" />
</svg>
