services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cise
      POSTGRES_PASSWORD: cise
      POSTGRES_DB: cise
    ports:
      - "5433:5432"
    volumes:
      - cise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cise"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:0.5.20
    restart: unless-stopped
    volumes:
      - cise_chromadata:/chroma/chroma
    ports:
      - "8001:8000"

  neo4j:
    image: neo4j:5.24-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/cisegraph123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - cise_neo4jdata:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
      neo4j:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://cise:cise@db:5432/cise
      POLL_INTERVAL_MINUTES_FAST: "5"
      POLL_INTERVAL_MINUTES_SLOW: "30"
      LOG_LEVEL: INFO
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cisegraph123
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1
      # Optional - leave unset/blank to skip ACLED gracefully. Set these in
      # a .env file (untracked) once you've registered at acleddata.com.
      ACLED_API_KEY: ${ACLED_API_KEY:-}
      ACLED_EMAIL: ${ACLED_EMAIL:-}
      # Telegram alerts - leave blank to skip (see app/alerts.py for setup).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_MIN_LEVEL: ${ALERT_MIN_LEVEL:-Red}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Email alerts - leave blank to skip (Gmail needs an app password; see app/alerts.py).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      # News headlines (https://gnews.io free key; blank = skipped).
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - app
    environment:
      API_BASE_URL: http://app:8000
    ports:
      - "3000:3000"

volumes:
  cise_pgdata:
  cise_chromadata:
  cise_neo4jdata:
